<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternal Waltz Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="quiz-container">
    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="screen-start">
      <h1>Eternal Waltz</h1>
      <p class="subtitle">JackNaib Itabooth</p>
      <p class="info-text">10 câu hỏi • Thời gian: 5 phút<br>Mỗi người chỉ làm 1 lần</p>
      <button class="btn primary" onclick="startQuiz()">Bắt đầu làm bài</button>
    </div>

    <!-- MÀN HÌNH LÀM BÀI (1 CÂU HỎI) -->
    <div id="screen-quiz" style="display: none;">
      <div class="quiz-header">
        <span id="question-count">Câu 1/10</span>
        <span id="timer">05:00</span>
      </div>
      <h2 id="question-text">Câu hỏi...</h2>
      <div id="options-list" class="options-group"></div>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="screen-result" style="display: none;">
      <h2>Kết Quả</h2>
      <div class="score" id="final-score">0/10</div>
      <p class="info-text">Bạn đã hoàn thành bài thi.<br>Mỗi người chỉ được làm 1 lần duy nhất.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
