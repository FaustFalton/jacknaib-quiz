<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Eternal Waltz Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="quiz-wrapper">
    <!-- Header ngắn gọn -->
    <div class="brand-header">
      <h1>Eternal Waltz</h1>
      <p>JackNaib Itabooth • Color Fiesta 17</p>
    </div>

    <!-- MÀN HÌNH 1: NHẬP TÊN & BẮT ĐẦU -->
    <div id="screen-start" class="card">
      <input type="text" id="player-name" placeholder="Nhập tên của bạn..." autocomplete="off" />
      <button class="btn-action" onclick="handleStart()">Bắt đầu làm bài</button>
      <div class="note-simple">Thời gian: 5 phút • Mỗi người chỉ làm 1 lần</div>
    </div>

    <!-- MÀN HÌNH 2: 1 CÂU HỎI DUY NHẤT TRÊN MÀN HÌNH -->
    <div id="screen-quiz" class="card" style="display: none;">
      <div class="quiz-meta">
        <span id="question-number">Câu 1/10</span>
        <span id="timer" class="timer-tag">05:00</span>
      </div>

      <div class="question-box">
        <h2 id="question-text">Đang tải câu hỏi...</h2>
        <div id="options-box" class="options-grid"></div>
      </div>
    </div>

    <!-- MÀN HÌNH 3: KẾT QUẢ ĐÓNG (CHỈ HIỆN ĐIỂM) -->
    <div id="screen-result" class="card result-card" style="display: none;">
      <div class="sub-title" id="result-name">Người chơi</div>
      <div class="score-number" id="result-score">0/10</div>
      <p class="result-msg">Bạn đã hoàn thành bài thi.<br>Hãy chụp màn hình để nhận quà tại booth nhé!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
