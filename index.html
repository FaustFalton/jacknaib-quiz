<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternal Waltz Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="quiz-container">
    <!-- MÀN HÌNH BẮT ĐẦU: Căn giữa, chỉ có 1 nút bấm to rõ -->
    <div id="screen-start">
      <h1>Eternal Waltz</h1>
      <p class="sub">JackNaib Itabooth</p>
      <div class="meta-tag">10 câu • 5 phút • Chỉ làm 1 lần</div>
      <button type="button" class="btn-start" onclick="startQuiz()">BẮT ĐẦU LÀM BÀI</button>
    </div>

    <!-- MÀN HÌNH CÂU HỎI: Bấm đáp án là tự nhảy câu kế tiếp -->
    <div id="screen-quiz" style="display: none;">
      <div class="top-bar">
        <span id="q-number">Câu 1/10</span>
        <span id="timer-text">05:00</span>
      </div>
      <h2 id="q-content">Đang tải câu hỏi...</h2>
      <div id="options-wrap" class="options-wrap"></div>
    </div>

    <!-- MÀN HÌNH KẾT QUẢ -->
    <div id="screen-result" style="display: none;">
      <h2>KẾT QUẢ</h2>
      <div class="score-num" id="score-text">0/10</div>
      <p class="note">Mỗi người chỉ được làm bài 1 lần.</p>
      <button type="button" class="btn-reset" onclick="resetQuiz()">🔄 Bấm để reset làm lại (Test)</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
